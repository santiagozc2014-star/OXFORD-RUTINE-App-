name: Test Oxford learning modules

on:
  push:
    branches: ["main", "feat/oxford-learning-engine"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run learning module tests
        run: node --test tests/oxford-enhancements.test.cjs
